name: ci
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --check shared/ui/app.js && node --check shared/ui/browser.js && node --check shared/ui/aimodel.js && node --check server/frontend/platform.js && node --check desktop/frontend/platform.js && node --check pages/platform.js
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r server/backend/requirements-dev.txt
      - run: python pages/tests/make_golden.py --check
      - run: node pages/tests/golden.test.mjs && node pages/tests/engine.test.mjs
      - run: node pages/build.mjs
  docker:
    runs-on: ubuntu-latest
    needs: [server, ui]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t debrief-ai .
